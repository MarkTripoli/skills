<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>JEV fixture</title></head>
<body>
<main><h1>Delivery check-in</h1>
<label for="name">Name</label><input id="name" name="name" autocomplete="off">
<label for="choice">Channel</label><select id="choice" name="choice"><option value="email">Email</option><option value="phone">Phone</option></select>
<button id="submit" type="button">Confirm</button>
<p id="status" role="status" aria-live="polite">Ready for confirmation.</p></main>
<script>
const status = document.querySelector('#status');
document.querySelector('#submit').addEventListener('click', () => {
  const name = document.querySelector('#name').value.trim();
  const channel = document.querySelector('#choice').value;
  status.textContent = name ? `Confirmed ${name} via ${channel}.` : 'Enter a name before confirming.';
});
</script></body></html>
