name: delivery-app-test-omp
description: |
  The manual app-test loop: drive the running application (web, iOS simulator, or Android emulator)
  through a charter derived from the task's artifacts, grade every step, and on a failure run
  iterate-implementation with the failing steps as feedback, then test again, until a pass. Each
  session is fresh. A blocked test (the app could not be launched or driven) cancels the run with the
  missing prerequisites recorded in the app-test artifact; three failed rounds fail the node. Composed
  by the delivery packs after implementation when `app_test` names a kind.
  NOT for: running on its own.
  Oh My Pi flavor: every AI phase runs in `omp -p`; deterministic nodes, gates, and loops are unchanged.

inputs:
  skills_dir:
    default: ~/.agents/skills
  task_dir:
    required: true
  kind:
    required: true
    description: "The surface under test: web, ios, or android."
  target:
    default: ""
    description: What to launch; a URL for web, a bundle id or .app path for ios, a package or .apk for android. Empty lets the skill start the repository's own dev server or build.

returns: test

nodes:
  # Body node ids are deliberately distinct from the include alias packs use (`app-test`): an alias
  # shadows a same-named body node when `$id.output` refs are rewired.
  - id: test
    loop_group:
      fresh_context: true
      max_iterations: 3
      until_bash: |
        status=$test-app.output.status
        test "$status" = passed
      nodes:
        - id: test-app
          bash: |
            set -eu
            v1=$LOOP_PREV.test-app.output.status
            v2=$LOOP_PREV.test-app.output.summary
            model=""
            if [ -n "${OMP_MODEL_LARGE:-}" ]; then model="--model=$OMP_MODEL_LARGE"; fi
            { prompt=$(cat); } <<DELIVERY_PROMPT
            Previous app-test session (both empty on the first session):
            status: ${v1}
            summary: ${v2}

            Read and follow ${INPUTS_SKILLS_DIR}/test-app/SKILL.md, the installed \`test-app\` skill, for task directory ${INPUTS_TASK_DIR}. kind: ${INPUTS_KIND}. target: ${INPUTS_TARGET} (empty means launch from the repository). In a later session the implementation was revised after the previous failure: revise the existing app-test artifact in place and re-run every charter step.

            The workflow engine runs the next phase; ignore any instruction in the skill about opening a new session. After saving the app-test artifact, answer with only the JSON object below: status from the artifact's frontmatter, artifact its file name, summary its frontmatter summary.

            CRITICAL: Respond with ONLY a JSON object matching this schema (JSON Schema, written as YAML). No prose before or after it.
            type: object
            properties:
              status: { type: string, enum: [passed, failed, blocked] }
              artifact: { type: string }
              summary: { type: string }
            required: [status, artifact, summary]
            DELIVERY_PROMPT
            answer=$(omp -p --auto-approve --no-session --max-time=45m ${model:+"$model"} "$prompt" </dev/null)
            judge="${INPUTS_SKILLS_DIR}/typed-judgment/judge.mjs"
            object=""
            if [ -f "$judge" ] && command -v node >/dev/null 2>&1; then
              object=$(printf '%s\n' "$answer" | node "$judge" extract-json --required 'status,artifact,summary' --enum 'status=passed,failed,blocked' --dir "${INPUTS_TASK_DIR}") || object=""
            fi
            if [ -n "$object" ]; then
              printf '%s\n' "$object"
            else
              printf '%s\n' "$answer" | awk '
                /^[[:space:]]*```/ { next }
                { n++; line[n] = $0 }
                !start && /^[[:space:]]*\{/ { start = n }
                /\}[[:space:]]*$/ { end = n }
                END { if (!start || end < start) { start = 1; end = n }; for (i = start; i <= end; i++) print line[i] }
              '
            fi
          timeout: 2760000

        - id: iterate-app
          depends_on: [test-app]
          when: "$test-app.output.status == 'failed'"
          bash: |
            set -eu
            v1=$test-app.output.artifact
            model=""
            if [ -n "${OMP_MODEL_LARGE:-}" ]; then model="--model=$OMP_MODEL_LARGE"; fi
            { prompt=$(cat); } <<DELIVERY_PROMPT
            Read and follow ${INPUTS_SKILLS_DIR}/iterate-implementation/SKILL.md, the installed \`iterate-implementation\` skill, for task directory ${INPUTS_TASK_DIR}. The feedback is the \`## Findings\` section of the app-test artifact ${v1} in that directory: each entry is a charter step that failed against the running application, with the expected and observed screen state. Fix the implementation so every listed step passes; do not edit the app-test artifact, the next test session revises it.

            The workflow engine runs the next phase; ignore any instruction in the skill about opening a new session. Print the skill's final answer.
            DELIVERY_PROMPT
            omp -p --auto-approve --no-session --max-time=45m ${model:+"$model"} "$prompt" </dev/null
          timeout: 2760000

        # Commits the session's artifact before the loop decides, so a blocked cancel and a failed
        # round both leave the app-test artifact on the branch.
        - id: test-done
          depends_on: [test-app, iterate-app]
          trigger_rule: none_failed_min_one_success
          # `$INPUTS.task_dir` is spliced with the pack's `with:` value (a `$task.output.task_dir` ref) when
          # the block is included; the environment variable covers a run of the block on its own.
          bash: |
            set -eu
            dir=${INPUTS_TASK_DIR:-$INPUTS.task_dir}
            git add -A -- "$dir"
            git diff --cached --quiet -- "$dir" || git commit -q -m "docs(task): app-test artifacts" -- "$dir"

        - id: test-blocked
          cancel: "App test blocked; supply what the newest app-test artifact's `## Missing` list names, then run the workflow again."
          depends_on: [test-done]
          when: "$test-app.output.status == 'blocked'"
