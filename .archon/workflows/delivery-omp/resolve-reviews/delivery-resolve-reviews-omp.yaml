name: delivery-resolve-reviews-omp
description: |
  Run one pull request review round for an existing delivery task: address every open review thread
  on the task's pull request, reply with evidence, push, and record the round. Pull request approval
  is external, so the run ends after one round; run it again when reviewers respond. Start it with
  `--adopt <run-id>` of the delivery run that opened the pull request (or `--branch <pr branch>`) so
  it works on that branch, and pass the task directory as `--input task_dir=...`.

  Use when: reviewers left comments on a pull request a delivery-* run opened, for example "address the review
  comments on the verbose-flag PR", "resolve the PR feedback for task X".
  NOT for: reviewing a pull request yourself (delivery-review is composed into the packs), or work
  that has no pull request yet.
  Oh My Pi flavor: every AI phase runs in `omp -p`; deterministic nodes, gates, and loops are unchanged.

inputs:
  skills_dir:
    default: ~/.agents/skills
    description: Directory holding the installed skills, one `<name>/SKILL.md` each.
  task_dir:
    required: true
    description: The task directory of the pull request, for example `.agents/tasks/verbose-flag`.

nodes:
  # Reuses the task directory (fails when it has no task.md) and resolves the skills directory.
  - id: task
    include: delivery-task-omp
    with:
      skills_dir: $INPUTS.skills_dir
      task_dir: $INPUTS.task_dir

  - id: round
    depends_on: [task]
    bash: |
      set -eu
      v1=$task.output.skills_dir
      v2=$task.output.task_dir
      model=""
      if [ -n "${OMP_MODEL_MEDIUM:-}" ]; then model="--model=$OMP_MODEL_MEDIUM"; fi
      { prompt=$(cat); } <<DELIVERY_PROMPT
      Read and follow ${v1}/resolve-pr-reviews/SKILL.md, the installed \`resolve-pr-reviews\` skill, for task directory ${v2}. Request context: ${ARGUMENTS:-}

      Nothing runs after this phase except a commit of the task directory; ignore any instruction in the skill about opening a new session. Print the skill's final answer.
      DELIVERY_PROMPT
      omp -p --auto-approve --no-session --max-time=45m ${model:+"$model"} "$prompt" </dev/null
    timeout: 2760000

  # The skill pushes before its round artifact lands, so this join commits and pushes it when the
  # branch has an upstream.
  - id: round-done
    depends_on: [round]
    bash: |
      set -eu
      dir=$task.output.task_dir
      git add -A -- "$dir"
      git diff --cached --quiet -- "$dir" || git commit -q -m "docs(task): review-round artifacts" -- "$dir"
      if git rev-parse --abbrev-ref --symbolic-full-name '@{u}' >/dev/null 2>&1; then git push -q; fi
