# gate=true and the previous pass's "request changes" asked to stop: `stopped` cancels the run before
# any skill runs.
intent: '{"intent":"stop"}'
next-phase: '{"next":""}'
fixture:
  expect: cancelled
  inputs: { task_dir: .agents/tasks/fixture, gate: "true" }
  reached: [intent, next-phase, stopped]
exec-code: false
