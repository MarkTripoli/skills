# `gates=none` and a confident route: no confirmation; the judged pick was not explicit, so `resolve`
# sends the run to the adaptive chain instead of the fixed oneshot pack, and task.md still names
# oneshot. The run reaches the adaptive child alone (a dry run cannot start a `workflow:` child, so it
# fails there; the seven other packs are skipped).
route: '{"workflow":"oneshot","gates":"none","suggested":"oneshot","confidence":"0.95","confirm":"false","explicit":"false"}'
resolve: '{"workflow":"oneshot","gates":"none","pack":"adaptive"}'
task__create: '{"task_dir":".agents/tasks/fixture","skills_dir":"/home/me/.agents/skills","tier":"","suggested_workflow":""}'
fixture:
  expect: failed
  fail-node: adaptive
  inputs: { gates: none }
  reached: [route, resolve, task__create]
exec-code: false
