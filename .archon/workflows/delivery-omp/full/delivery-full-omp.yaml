name: delivery-full-omp
description: |
  Take a change that needs research and a design decision from request to pull request: research
  questions, research, design discussion (gate), plan (gate), implementation one phase per fresh
  session (gate after each), verification (checks and acceptance items re-run in a fresh session),
  review loop until clean, pull request description (gate). Every phase runs in a fresh session and
  reads only the task directory; artifacts are the memory and are committed on the branch. The
  `gates` input picks which pauses happen: `--input gates=none` runs unattended,
  `--input gates=plan,pr` pauses only there.

  Use when: competing approaches, cross-module impact, migrations, a new or changed interface others
  depend on, or the user asks for a design review, for example "design and build X", "add an API for Y".
  NOT for: a bug with a reproduction (delivery-bugfix), a bounded change with a clear shape
  (delivery-lean), an open requirement (delivery-prd), or a fully specified small change
  (delivery-oneshot).
  Oh My Pi flavor: every AI phase runs in `omp -p`; deterministic nodes, gates, and loops are unchanged.

interactive: true

inputs:
  skills_dir:
    default: ~/.agents/skills
    description: Directory holding the installed skills, one `<name>/SKILL.md` each.
  task_dir:
    default: ""
    description: Reuse this existing task directory (an epic child, or one created by hand) instead of creating one.
  review_each_phase:
    default: "false"
    description: Set to true to run the review loop after every implementation phase, not only at the end.
  gates:
    default: all
    description: "Human gates to keep: `all`, `none`, or a comma-separated subset of design, plan, phases, pr."
  app_test:
    default: none
    description: "Manual app testing after implementation: `none`, or the surface to drive, `web`, `ios`, or `android`; see docs/app-testing.md."
  app_target:
    default: ""
    description: What the app test launches; a URL for web, a bundle id or .app path for ios, a package or .apk for android. Empty lets the skill start the repository's own dev server or build.
  verify:
    default: "true"
    description: "Run the verification phase after implementation: `true` (default) re-runs the repository's checks and the task's acceptance items in a fresh session, `false` skips it; see docs/verification.md."

# The `*-done` nodes do two jobs: they commit the phase's artifacts, and they keep every loop body
# runnable (Archon 0.10 drops a loop_group's body when the group belongs to an include whose dependency
# is another include). A join after a gated include needs `none_failed_min_one_success`: one of the
# include's two branches is always skipped. See workflows/delivery.md, Archon notes.
nodes:
  - id: task
    include: delivery-task-omp
    with:
      skills_dir: $INPUTS.skills_dir
      workflow: full
      task_dir: $INPUTS.task_dir

  - id: gates
    depends_on: [task]
    bash: |
      set -eu
      names="design plan phases pr"
      requested=$(printf '%s' "${INPUTS_GATES:-all}" | tr -d ' ')
      case "$requested" in
        all|'') on="$names" ;;
        none) on="" ;;
        *)
          on=""
          for g in $(printf '%s' "$requested" | tr ',' ' '); do
            case " $names " in
              *" $g "*) on="$on $g" ;;
              *) printf 'gates: unknown gate "%s"; use all, none, or a comma-separated subset of: %s\n' "$g" "$names" >&2; exit 1 ;;
            esac
          done ;;
      esac
      out=""
      for name in $names; do
        case " $on " in *" $name "*) v=true ;; *) v=false ;; esac
        out="$out${out:+,}\"$name\":\"$v\""
      done
      printf '{%s}\n' "$out"
    output_format:
      type: object
      properties:
        design: { type: string }
        plan: { type: string }
        phases: { type: string }
        pr: { type: string }
      required: [design, plan, phases, pr]

  - id: research
    include: delivery-research-omp
    depends_on: [task, gates]
    with:
      skills_dir: $task.output.skills_dir
      task_dir: $task.output.task_dir

  - id: research-done
    depends_on: [research]
    bash: |
      set -eu
      dir=$task.output.task_dir
      git add -A -- "$dir"
      git diff --cached --quiet -- "$dir" || git commit -q -m "docs(task): research artifacts" -- "$dir"

  - id: design
    include: delivery-gate-phase-omp
    depends_on: [research-done]
    with:
      skills_dir: $task.output.skills_dir
      task_dir: $task.output.task_dir
      skill: create-design-discussion
      iterate: iterate-design-discussion
      label: the design discussion
      gate: $gates.output.design

  - id: design-done
    depends_on: [design]
    trigger_rule: none_failed_min_one_success
    bash: |
      set -eu
      dir=$task.output.task_dir
      git add -A -- "$dir"
      git diff --cached --quiet -- "$dir" || git commit -q -m "docs(task): design artifacts" -- "$dir"

  - id: plan
    include: delivery-gate-phase-omp
    depends_on: [design-done]
    with:
      skills_dir: $task.output.skills_dir
      task_dir: $task.output.task_dir
      skill: create-plan
      iterate: iterate-plan
      label: the plan
      gate: $gates.output.plan

  - id: plan-done
    depends_on: [plan]
    trigger_rule: none_failed_min_one_success
    bash: |
      set -eu
      dir=$task.output.task_dir
      git add -A -- "$dir"
      git diff --cached --quiet -- "$dir" || git commit -q -m "docs(task): plan artifacts" -- "$dir"

  - id: implement
    include: delivery-implement-omp
    depends_on: [plan-done]
    with:
      skills_dir: $task.output.skills_dir
      task_dir: $task.output.task_dir
      skill: implement-plan
      review: $INPUTS.review_each_phase
      gate: $gates.output.phases

  - id: implement-done
    depends_on: [implement]
    trigger_rule: none_failed_min_one_success
    bash: |
      set -eu
      dir=$task.output.task_dir
      git add -A -- "$dir"
      git diff --cached --quiet -- "$dir" || git commit -q -m "docs(task): implement artifacts" -- "$dir"

  # Verification unless turned off: the include's `when` gates every node of the block, and the join fires
  # from implement-done alone when the block is skipped.
  - id: verify
    include: delivery-verify-omp
    depends_on: [implement-done]
    when: "$INPUTS.verify != 'false'"
    with:
      skills_dir: $task.output.skills_dir
      task_dir: $task.output.task_dir

  - id: verify-done
    depends_on: [implement-done, verify]
    trigger_rule: none_failed_min_one_success
    # The block commits its own artifacts; this join picks up what the preceding phase left in the task directory.
    bash: |
      set -eu
      dir=$task.output.task_dir
      git add -A -- "$dir"
      git diff --cached --quiet -- "$dir" || git commit -q -m "docs(task): implement artifacts" -- "$dir"

  # Manual app testing when asked: the include's `when` gates every node of the block, and the join fires
  # from verify-done alone when the block is skipped.
  - id: app-test
    include: delivery-app-test-omp
    depends_on: [verify-done]
    when: "$INPUTS.app_test != 'none'"
    with:
      skills_dir: $task.output.skills_dir
      task_dir: $task.output.task_dir
      kind: $INPUTS.app_test
      target: $INPUTS.app_target

  - id: app-test-done
    depends_on: [verify-done, app-test]
    trigger_rule: none_failed_min_one_success
    # The block commits its own artifacts; this join picks up what the preceding phase left in the task directory.
    bash: |
      set -eu
      dir=$task.output.task_dir
      git add -A -- "$dir"
      git diff --cached --quiet -- "$dir" || git commit -q -m "docs(task): implement artifacts" -- "$dir"

  - id: review
    include: delivery-review-omp
    depends_on: [app-test-done]
    with:
      skills_dir: $task.output.skills_dir
      task_dir: $task.output.task_dir

  - id: review-done
    depends_on: [review]
    bash: |
      set -eu
      dir=$task.output.task_dir
      git add -A -- "$dir"
      git diff --cached --quiet -- "$dir" || git commit -q -m "docs(task): review artifacts" -- "$dir"

  - id: pr
    include: delivery-gate-phase-omp
    depends_on: [review-done]
    with:
      skills_dir: $task.output.skills_dir
      task_dir: $task.output.task_dir
      skill: describe-pr
      iterate: describe-pr
      label: the pull request description
      gate: $gates.output.pr

  # The pull request is the deliverable, so the branch must reach the remote: the join pushes its own
  # commit when the branch has an upstream, and pushes the branch with one when `origin` exists and
  # describe-pr did not (no `gh` or `glab`, or a remote it could not open a pull request on).
  - id: pr-done
    depends_on: [pr]
    trigger_rule: none_failed_min_one_success
    bash: |
      set -eu
      dir=$task.output.task_dir
      git add -A -- "$dir"
      git diff --cached --quiet -- "$dir" || git commit -q -m "docs(task): pr artifacts" -- "$dir"
      if git rev-parse --abbrev-ref --symbolic-full-name '@{u}' >/dev/null 2>&1; then git push -q
      elif git remote get-url origin >/dev/null 2>&1; then GIT_TERMINAL_PROMPT=0 git push -q -u origin HEAD; fi
