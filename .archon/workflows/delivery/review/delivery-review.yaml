name: delivery-review
description: |
  The review loop: review the diff against the merge target, fix every finding, review again, until a
  review is clean. Each pass is a fresh session. A blocked review cancels the run with the blocker
  recorded in the code-review artifact; four passes with findings still open fail the node. Composed by
  the delivery packs after implementation, and by the implementation block after every phase when asked.
  NOT for: running on its own.

inputs:
  skills_dir:
    default: ~/.agents/skills
  task_dir:
    required: true

returns: loop

nodes:
  # Body node ids are deliberately distinct from the include aliases packs use (`review`,
  # `phase-review`): an alias shadows a same-named body node when `$id.output` refs are rewired.
  - id: loop
    loop_group:
      fresh_context: true
      max_iterations: 4
      until_bash: |
        status=$review-code.output.status
        test "$status" = clean
      nodes:
        - id: review-code
          context: fresh
          prompt: |
            Read and follow $INPUTS.skills_dir/review-code/SKILL.md, the installed `review-code` skill, for task directory $INPUTS.task_dir. Review the whole current diff against the merge target.

            The workflow engine runs the next phase; ignore any instruction in the skill about opening a new session. After saving the code-review artifact, answer with only the JSON object below, where status is the artifact's frontmatter `status` and artifact is its file name.
          output_format:
            type: object
            properties:
              status: { type: string, enum: [clean, findings, blocked] }
              artifact: { type: string }
              summary: { type: string }
            required: [status, artifact, summary]

        - id: review-blocked
          cancel: "Review blocked; resolve the blocker recorded in the newest code-review artifact, then run the workflow again."
          depends_on: [review-code]
          when: "$review-code.output.status == 'blocked'"

        - id: fix-review
          context: fresh
          depends_on: [review-code]
          when: "$review-code.output.status == 'findings'"
          prompt: |
            Read and follow $INPUTS.skills_dir/fix-code-review/SKILL.md, the installed `fix-code-review` skill, for task directory $INPUTS.task_dir, fixing every finding in the code-review artifact $review-code.output.artifact. Advisories included.

            The workflow engine runs the next phase; ignore any instruction in the skill about opening a new session. Print the skill's final answer.
