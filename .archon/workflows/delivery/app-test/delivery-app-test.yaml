name: delivery-app-test
description: |
  The manual app-test loop: drive the running application (web, iOS simulator, or Android emulator)
  through a charter derived from the task's artifacts, grade every step, and on a failure run
  iterate-implementation with the failing steps as feedback, then test again, until a pass. Each
  session is fresh. A blocked test (the app could not be launched or driven) cancels the run with the
  missing prerequisites recorded in the app-test artifact; three failed rounds fail the node. Composed
  by the delivery packs after implementation when `app_test` names a kind.
  NOT for: running on its own.

inputs:
  skills_dir:
    default: ~/.agents/skills
  task_dir:
    required: true
  kind:
    required: true
    description: "The surface under test: web, ios, or android."
  target:
    default: ""
    description: What to launch; a URL for web, a bundle id or .app path for ios, a package or .apk for android. Empty lets the skill start the repository's own dev server or build.

returns: test

nodes:
  # Body node ids are deliberately distinct from the include alias packs use (`app-test`): an alias
  # shadows a same-named body node when `$id.output` refs are rewired.
  - id: test
    loop_group:
      fresh_context: true
      max_iterations: 3
      until_bash: |
        status=$test-app.output.status
        test "$status" = passed
      nodes:
        - id: test-app
          context: fresh
          model: large
          prompt: |
            Previous app-test session (both empty on the first session):
            status: $LOOP_PREV.test-app.output.status
            summary: $LOOP_PREV.test-app.output.summary

            Read and follow $INPUTS.skills_dir/test-app/SKILL.md, the installed `test-app` skill, for task directory $INPUTS.task_dir. kind: $INPUTS.kind. target: $INPUTS.target (empty means launch from the repository). In a later session the implementation was revised after the previous failure: revise the existing app-test artifact in place and re-run every charter step.

            The workflow engine runs the next phase; ignore any instruction in the skill about opening a new session. After saving the app-test artifact, answer with only the JSON object below: status from the artifact's frontmatter, artifact its file name, summary its frontmatter summary.
          output_format:
            type: object
            properties:
              status: { type: string, enum: [passed, failed, blocked] }
              artifact: { type: string }
              summary: { type: string }
            required: [status, artifact, summary]

        - id: iterate-app
          context: fresh
          model: large
          depends_on: [test-app]
          when: "$test-app.output.status == 'failed'"
          prompt: |
            Read and follow $INPUTS.skills_dir/iterate-implementation/SKILL.md, the installed `iterate-implementation` skill, for task directory $INPUTS.task_dir. The feedback is the `## Findings` section of the app-test artifact $test-app.output.artifact in that directory: each entry is a charter step that failed against the running application, with the expected and observed screen state. Fix the implementation so every listed step passes; do not edit the app-test artifact, the next test session revises it.

            The workflow engine runs the next phase; ignore any instruction in the skill about opening a new session. Print the skill's final answer.

        # Commits the session's artifact before the loop decides, so a blocked cancel and a failed
        # round both leave the app-test artifact on the branch.
        - id: test-done
          depends_on: [test-app, iterate-app]
          trigger_rule: none_failed_min_one_success
          # `$INPUTS.task_dir` is spliced with the pack's `with:` value (a `$task.output.task_dir` ref) when
          # the block is included; the environment variable covers a run of the block on its own.
          bash: |
            set -eu
            dir=${INPUTS_TASK_DIR:-$INPUTS.task_dir}
            git add -A -- "$dir"
            git diff --cached --quiet -- "$dir" || git commit -q -m "docs(task): app-test artifacts" -- "$dir"

        - id: test-blocked
          cancel: "App test blocked; supply what the newest app-test artifact's `## Missing` list names, then run the workflow again."
          depends_on: [test-done]
          when: "$test-app.output.status == 'blocked'"
