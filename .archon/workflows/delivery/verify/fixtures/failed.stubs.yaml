# A failed verification runs `iterate-verify` with the findings as feedback before the commit join. A
# dry run never executes `until_bash`, so the loop is assumed complete after this one round; the real run
# verifies again until a pass or three rounds.
verify-implementation: '{"status":"failed","artifact":"06-verification-fixture.md","summary":"A2 failed: --json prints a table"}'
verification-status: '{"status":"failed"}'
iterate-verify: "implementation revised for A2"
verification-done: ""
fixture:
  expect: completed
  inputs: { task_dir: .agents/tasks/fixture }
  reached: [verify-implementation, verification-status, iterate-verify, verification-done, verification]
exec-code: false
