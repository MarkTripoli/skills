# `--input workflow=bugfix`: the pack is taken as given, nothing to confirm, the task directory is
# opened for bugfix, and the run reaches the bugfix child alone (a dry run cannot start a `workflow:`
# child, so it fails there).
route: '{"workflow":"bugfix","gates":"all","suggested":"","confidence":"unknown","confirm":"false"}'
resolve: '{"workflow":"bugfix","gates":"all"}'
task__create: '{"task_dir":".agents/tasks/fixture","skills_dir":"/home/me/.agents/skills","tier":"","suggested_workflow":""}'
fixture:
  expect: failed
  fail-node: bugfix
  inputs: { workflow: bugfix }
  reached: [route, resolve, task__create]
exec-code: false
