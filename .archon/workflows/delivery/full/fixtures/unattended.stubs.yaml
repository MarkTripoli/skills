# `gates=none`: every gate-phase include takes its `once` twin, the implement include its
# `phases-auto` loop, and the run ends at `pr-done` without a pause.
task__create: '{"task_dir":".agents/tasks/fixture","skills_dir":"/home/me/.agents/skills"}'
gates: '{"design":"false","plan":"false","phases":"false","pr":"false"}'
research__questions: "research questions saved"
research__research: "research saved"
design__once: "design discussion saved"
plan__once: "plan saved"
implement-phase-auto: "phase implemented"
review-code: '{"status":"clean","artifact":"05-code-review-fixture.md","summary":"clean"}'
pr__once: "pull request described"
research-done: ""
design-done: ""
plan-done: ""
implement-done: ""
review-done: ""
pr-done: ""
fixture:
  expect: completed
  inputs: { gates: none }
  reached: [design__once, plan__once, implement__phases-auto, implement-phase-auto, review__loop, pr__once, pr-done]
exec-code: false
