name: delivery-epic-wave
description: |
  Start the next wave of an epic whose children are already open: on the epic branch, find the
  children whose dependencies have merged (their `.agents/tasks/<child>/pr-description.md` is on the
  branch) and no branch of their own yet, and start each as its own unattended `archon workflow run
  delivery-<child workflow>` cut from the epic branch, at most `max_parallel` at a time. Run it by hand
  after merging a wave's pull requests: `archon workflow run delivery-epic-wave --branch epic-<slug>
  --input epic_dir=.agents/tasks/<epic slug> "next wave"`. With `--input children=manual` it prints the
  start commands instead of running them.

  Use when: an epic opened by delivery-epic or delivery-program has merged children and the next wave
  should start.
  NOT for: a new request (delivery-epic, delivery-program) or a single deliverable.

inputs:
  skills_dir:
    default: ~/.agents/skills
    description: Directory holding the installed skills, one `<name>/SKILL.md` each; passed to every child run.
  epic_dir:
    required: true
    description: The epic's task directory (`.agents/tasks/<epic slug>`).
  max_parallel:
    default: "3"
    description: How many child runs to keep running at once.
  children:
    default: auto
    description: "`auto` starts every ready child; `manual` prints the start commands and starts nothing."

nodes:
  - id: wave
    include: delivery-wave
    with:
      skills_dir: $INPUTS.skills_dir
      epic_dir: $INPUTS.epic_dir
      max_parallel: $INPUTS.max_parallel
      children: $INPUTS.children
