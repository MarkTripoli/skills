# `gates=none`: research/design/prd/tdd judged unnecessary at their boundaries, planning stays plan
# (the default derivation with no outline evidence), so the run reaches only research's decide-done
# join before the design phases, then the plan phase (unattended, `once`) and the implement loop's
# unattended twin, ending at pr's unattended `once` branch. The three gated design/prd/tdd nodes and
# their siblings get no stub at all: `archon workflow test` reports an unused stub for a node that
# never reaches its body, so a skipped node's absence from this file is what proves it was skipped.
