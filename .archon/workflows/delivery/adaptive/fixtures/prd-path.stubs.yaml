# The design boundary judges design discussion unnecessary but prd and tdd necessary, and the design
# boundary's own decide node lands on `outline` rather than `plan`: prd and tdd run, design does not
# (no stub for its own `phase`/`gate`/`intent` instance is needed; `pr`'s unconditional instance is
# what keeps the shared bare stubs used), and `plan-done` tolerates `plan` being skipped while
# `outline` runs. `phase`/`gate`/`intent` are shared, generic stubs the same way `all-phases.stubs.yaml`
# uses them; see that file's comment for why their `design`/`prd`/`tdd`/`outline` instances are not
# individually reached in a dry run.
