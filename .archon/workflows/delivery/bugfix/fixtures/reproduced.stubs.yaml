# `gates=none` with the deterministic nodes executed in Archon's scratch worktree: the real `gates`
# node reads the input, `task__create` commits task.md there, `attempt-count` reads the session's
# status, `not-reproduced` stays skipped, and every join commits. Only the AI nodes are stubbed.
attempt-auto: '{"status":"reproduced","summary":"exit code 0 on a missing config","artifact":"01-reproduction-fixture.md"}'
fix: "bug fixed and committed"
review-code: '{"status":"clean","artifact":"05-code-review-fixture.md","summary":"clean"}'
pr__once: "pull request described"
verify-implementation: '{"status":"passed","artifact":"06-verification-fixture.md","summary":"checks and acceptance items passed"}'
fixture:
  expect: completed
  inputs: { gates: none }
  reached: [task__create, gates, attempt-auto, attempt-count, reproduce-auto, reproduce-done, fix, verify-done, review__loop, review-done, pr__once, pr-done]
exec-code: true
