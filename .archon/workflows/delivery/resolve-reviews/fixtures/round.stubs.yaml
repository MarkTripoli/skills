# One review round for an existing task directory: the task include reuses it, then `round` and the
# `round-done` commit.
task__create: '{"task_dir":".agents/tasks/fixture","skills_dir":"/home/me/.agents/skills"}'
round: "review round recorded"
round-done: ""
fixture:
  expect: completed
  inputs: { task_dir: .agents/tasks/fixture }
  reached: [task__create, round, round-done]
exec-code: false
